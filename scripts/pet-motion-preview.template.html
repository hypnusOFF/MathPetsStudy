<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学宠物岛 · 动作预览</title>
<style>
__MOTION_CSS__
*{box-sizing:border-box}body{margin:0;background:#fbf7f0;color:#59444d;font:15px/1.65 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px 60px}h1{font-size:29px;margin:5px 0}h2{font-size:21px;margin:32px 0 12px}p{color:#94838b}.lab{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.scene{border:1px solid #eee0dd;background:radial-gradient(ellipse at 50% 42%,#fffdf8,#f5eceb);border-radius:30px;min-height:420px;display:grid;place-items:center;position:relative}.scene .pet-motion{width:340px;max-width:95%}.panel{background:white;border:1px solid #eee0dd;border-radius:24px;padding:22px}label{display:block;color:#8b758a;font-size:12px;font-weight:600;margin-top:16px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}button{font:inherit;border:1px solid #e1d6ea;background:#f3edf8;color:#795f91;border-radius:12px;padding:8px 12px;cursor:pointer}button.active{background:#967bb6;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #c4aee3;outline-offset:2px}.status{background:#faf4e8;border-radius:12px;padding:12px;font-size:13px;min-height:68px;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #eee0dd;border-radius:22px;text-align:center;padding:12px}.card .pet-motion{width:100%;max-width:220px;margin:auto}.card small{display:block;color:#9b8494}.note{font-size:12px}.caption{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#998398;font-size:12px}@media(max-width:700px){main{padding:22px 16px 50px}h1{font-size:24px}.lab{grid-template-columns:1fr}.scene{min-height:340px}.scene .pet-motion{width:285px}.grid{gap:8px}.card{padding:7px}.card .pet-motion{max-width:145px}.card strong{font-size:12px}}
.card .decor-fashion{max-width:100%;height:auto!important;aspect-ratio:1}.card .decor-icon{max-width:100%}
</style>
<main><h1>小伙伴，动起来。</h1><p>保留原画的毛绒感，用轻柔动作回应每一次互动。</p>
<div class="lab"><div class="scene"><div id="actor"></div><div class="caption" id="caption"></div></div><div class="panel">
<label>选择伙伴</label><div class="buttons" id="species"></div><label>成长阶段</label><div class="buttons" id="stages"></div><label>互动动作</label><div class="buttons" id="actions"></div>
<label>换装（仅预览）</label><div class="row"><select id="headwear"><option value="">无头饰</option><option value="bow">蝴蝶结</option><option value="hat">帽子</option><option value="star-clip">星星发夹</option></select><select id="outfit"><option value="">无衣服</option><option value="scarf">围巾</option><option value="overalls">背带衣</option><option value="cape">披风</option></select><select id="accessory"><option value="">默认进化配饰</option><option value="backpack">书包</option><option value="bell">项链</option><option value="badge">徽章</option></select></div><label>家园</label><select id="room"><option value="room-study">学习角</option><option value="room-spring">春日小屋</option><option value="room-stars">星光小屋</option></select><label><input type="checkbox" id="sound" checked> 播放音效</label><label><input type="checkbox" id="reduced"> 减少动画</label><div class="status" id="status" role="status" aria-live="polite">正在轻轻呼吸，选择一个互动试试看。</div>
<p class="note">点击宠物也可以摸摸。动作结束自动回到待机；最终进化后不再继续变形。</p></div></div>
<h2>九种成长形态</h2><div class="grid" id="catalog"></div>
<h2>衣饰与道具资源</h2><div class="grid" id="resource-gallery"></div><p class="note">轻量分层动画含眨眼、闭口咀嚼和耳尾爪裁片动作，不使用骨骼引擎。幼年没有配饰，初次进化增加小配饰，最终进化出现毛纹。此页用于资源预览；应用内已接入三宠独立培养、等级和穿搭存档。</p></main>
<script>
const D=__PAYLOAD__;let species='rabbit',stage='baby',action='idle',oldStage=null,busy=false,timer=null;
const $=id=>document.getElementById(id), sprites=D.sprites;
function add(text,value,parent,fn){const b=document.createElement('button');b.textContent=text;b.dataset.value=value;b.onclick=fn;$(parent).append(b)}
function reset(){clearTimeout(timer);busy=false;action='idle';oldStage=null}
const fashion=['bow','hat','star-clip','scarf','overalls','cape','backpack','bell','badge'];
function clothes(id,slot,kind,signature=false){if(!id)return '';const i=fashion.indexOf(id);return '<span class="decor-fashion pet-clothes clothes-'+slot+' clothes-'+kind+' clothes-'+id+(signature?' signature':'')+'" style="background-image:url('+D.decor['fashion-sheet']+');background-position:'+(i%3*50)+'% '+(Math.floor(i/3)*50)+'%"></span>';}
function body(kind,s,head='',outfit='',accessory=''){const img='<img class="pet-sprite sprite-'+kind+'-'+s+'" alt="'+D.species[kind]+'" src="'+sprites[kind+'-'+s]+'">',closed='<img class="pet-sprite sprite-'+kind+'-'+s+'-closed" alt="" src="'+sprites[kind+'-'+s+'-closed']+'">';return '<div class="pet-base">'+img+'</div><div class="pet-expression">'+closed+'</div>'+clothes(head,'head',kind)+clothes(outfit,'body',kind)+clothes(accessory||(s==='baby'?'':kind==='fox'?'star-clip':'bow'),'accessory',kind,!accessory);}
let audioContext;function sound(id){if(!$('sound').checked)return;try{audioContext??=new AudioContext();audioContext.resume();const notes=id==='evolve'?[392,523,659,784,1047]:id==='upgrade'?[523,659,784,1047]:[523,659];notes.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.12;o.frequency.value=f;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.19);});}catch{}}
function draw(){
 const root=document.createElement('div');root.className='pet-motion';root.dataset.action=action;root.dataset.species=species;root.dataset.motion=$('reduced').checked?'reduced':'full';root.style.setProperty('--pet-duration',(D.actions.find(a=>a.id===action).durationMs||2000)+'ms');
 root.innerHTML='<span class="pet-shadow"></span>'+body(species,stage,$('headwear').value,$('outfit').value,$('accessory').value)+(oldStage?'<img class="pet-sprite pet-old sprite-'+species+'-'+oldStage+'" alt="" src="'+sprites[species+'-'+oldStage]+'">':'')+(['upgrade','evolve'].includes(action)?'<span class="pet-ring"></span>':'')+(action==='encourage'?'<span class="pet-effect pet-heart">♥</span>':'')+(['correct','upgrade','evolve'].includes(action)?'<span class="pet-effect pet-star">✦</span>':'')+(action==='feed'?'<img class="pet-effect pet-food" alt="" src="'+D.food+'">':'')+(action==='play'?'<img class="pet-effect pet-toy" alt="" src="'+D.toy+'">':'');
 document.querySelector('.scene').style.background='center/cover url('+D.decor[$('room').value]+')';root.onclick=()=>act('pet');root.querySelectorAll('.pet-effect,.pet-ring,.pet-shadow,.pet-old').forEach(el=>el.setAttribute('aria-hidden','true'));$('actor').replaceChildren(root);
 for(const [id,value]of [['species',species],['stages',stage],['actions',action]])for(const b of $(id).children){b.classList.toggle('active',b.dataset.value===value);if(id==='actions')b.disabled=busy||(b.dataset.value==='evolve'&&stage==='mature')}
 $('caption').textContent=D.species[species]+' · '+D.stages[stage];
}
function act(id){if(busy||id==='evolve'&&stage==='mature')return;reset();if(id==='idle'){draw();return}const a=D.actions.find(a=>a.id===id);action=id;busy=true;sound(id);if(id==='evolve'){oldStage=stage;stage=stage==='baby'?'young':'mature'}draw();$('status').textContent=a.description;timer=setTimeout(()=>{reset();draw();$('status').textContent='动作完成，回到呼吸待机。'},a.durationMs)}
for(const [id,name]of Object.entries(D.species))add(name,id,'species',()=>{reset();species=id;draw();$('status').textContent='已切换伙伴。'});
for(const [id,name]of Object.entries(D.stages))add(name,id,'stages',()=>{reset();stage=id;draw();$('status').textContent='已切换成长阶段。'});
for(const a of D.actions)add(a.name,a.id,'actions',()=>act(a.id));
for(const id of ['headwear','outfit','accessory','room'])$(id).onchange=draw;
$('reduced').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;$('reduced').onchange=draw;
for(const kind of Object.keys(D.species))for(const s of Object.keys(D.stages)){const div=document.createElement('div');div.className='card';div.innerHTML='<div class="pet-motion" data-species="'+kind+'">'+body(kind,s)+'</div><strong>'+D.species[kind]+'</strong><small>'+D.stages[s]+'</small>';$('catalog').append(div)}
for(const [i,id]of fashion.entries()){const card=document.createElement('div');card.className='card';card.innerHTML='<span class="decor-fashion" style="width:130px;height:130px;background-image:url('+D.decor['fashion-sheet']+');background-position:'+i%3*50+'% '+Math.floor(i/3)*50+'%"></span>';$('resource-gallery').append(card);}
for(let i=0;i<14;i++){const card=document.createElement('div');card.className='card';card.innerHTML='<span class="decor-icon" style="width:85px;height:119px;background-image:url('+D.decor['icon-sheet']+');background-position:'+i%7*100/6+'% '+Math.floor(i/7)*100+'%"></span>';$('resource-gallery').append(card);}
draw();
</script></html>
