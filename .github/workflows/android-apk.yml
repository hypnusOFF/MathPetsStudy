name: Android APK download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'NuGet.Config'
      - 'scripts/verify-workload-packages.py'
      - 'scripts/prepare-android-sdk.py'

permissions:
  contents: read

concurrency:
  group: android-apk-download
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /tmp/mathpet-android-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android --skip-manifest-update
          python3 scripts/verify-workload-packages.py
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      - name: Prepare Android SDK
        run: |
          python3 scripts/prepare-android-sdk.py
      - name: Verify core rules
        run: |
          python3 scripts/ci-command.py dotnet restore tests/MathPet.Core.Tests/MathPet.Core.Tests.csproj --locked-mode
          python3 scripts/ci-command.py dotnet test tests/MathPet.Core.Tests/MathPet.Core.Tests.csproj --no-restore
      - name: Build self-contained development APK
        run: python3 scripts/ci-command.py bash scripts/build-android.sh
        env:
          MATHPET_KEY_DIR: ${{ runner.temp }}/mathpet-dev-keys
      - name: Upload downloadable APK archive
        uses: actions/upload-artifact@v4
        with:
          name: mathpet-0.1.0-android
          path: |
            artifacts/mathpet-0.1.0.apk
            artifacts/mathpet-0.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
