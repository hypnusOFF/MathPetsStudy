name: Android APK download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-download
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android --skip-manifest-update
          find "$DOTNET_ROOT/packs" "$DOTNET_ROOT/template-packs" "$DOTNET_ROOT/library-packs" \
            -name '*.nupkg' -print0 | xargs -0 dotnet nuget verify --all
        env:
          DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'
      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verify core rules
        run: dotnet test tests/MathPet.Core.Tests --locked-mode
      - name: Build self-contained development APK
        run: bash scripts/build-android.sh
        env:
          MATHPET_KEY_DIR: ${{ runner.temp }}/mathpet-dev-keys
      - name: Upload downloadable APK archive
        uses: actions/upload-artifact@v4
        with:
          name: mathpet-0.1.0-android
          path: |
            artifacts/mathpet-0.1.0.apk
            artifacts/mathpet-0.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
