 d="M186 273 L186 278 M193 273 L193 278" fill="none" stroke="#63473f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-layer="slot-accessory"></g></g><g class="effect hearts" data-layer="effect-hearts"><path d="M65 149 C50 137 48 158 65 170 C82 158 80 137 65 149" fill="#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M253 134 C238 122 236 143 253 155 C270 143 268 122 253 134" fill="#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect sparkles" data-layer="effect-sparkles"><polygon points="66.00,103.00 69.51,111.16 78.36,111.98 71.69,117.85 73.64,126.52 66.00,121.98 58.36,126.52 60.31,117.85 53.64,111.98 62.49,111.16" fill="#f2c96e"/><polygon points="253.00,75.00 256.79,83.79 266.31,84.67 259.12,90.99 261.23,100.33 253.00,95.44 244.77,100.33 246.88,90.99 239.69,84.67 249.21,83.79" fill="#f2c96e"/><polygon points="62.00,251.00 64.16,256.02 69.61,256.53 65.50,260.14 66.70,265.47 62.00,262.68 57.30,265.47 58.50,260.14 54.39,256.53 59.84,256.02" fill="#f2c96e"/><polygon points="257.00,270.00 259.70,276.28 266.51,276.91 261.37,281.42 262.88,288.09 257.00,284.60 251.12,288.09 252.63,281.42 247.49,276.91 254.30,276.28" fill="#f2c96e"/></g><g class="effect food-effect" data-layer="effect-food"><path d="M232 204 Q212 180 230 177 Q241 170 244 181 Q263 175 261 193 Q252 212 232 204" fill="#efa28e" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 182 L245 170" fill="none" stroke="#63473f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect toy-effect" data-layer="effect-toy"><ellipse cx="254" cy="316" rx="19" ry="19" fill="#ad98df" stroke="#63473f" stroke-width="3" /><path d="M240 305 Q266 309 257 334 M245 303 Q243 321 268 322" fill="none" stroke="#e9e1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
