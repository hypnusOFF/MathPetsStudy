#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M253 134 C238 122 236 143 253 155 C270 143 268 122 253 134" fill="#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect sparkles" data-layer="effect-sparkles"><polygon points="66.00,126.00 69.51,134.16 78.36,134.98 71.69,140.85 73.64,149.52 66.00,144.98 58.36,149.52 60.31,140.85 53.64,134.98 62.49,134.16" fill="#f2c96e"/><polygon points="253.00,98.00 256.79,106.79 266.31,107.67 259.12,113.99 261.23,123.33 253.00,118.44 244.77,123.33 246.88,113.99 239.69,107.67 249.21,106.79" fill="#f2c96e"/><polygon points="62.00,265.00 64.16,270.02 69.61,270.53 65.50,274.14 66.70,279.47 62.00,276.68 57.30,279.47 58.50,274.14 54.39,270.53 59.84,270.02" fill="#f2c96e"/><polygon points="257.00,284.00 259.70,290.28 266.51,290.91 261.37,295.42 262.88,302.09 257.00,298.60 251.12,302.09 252.63,295.42 247.49,290.91 254.30,290.28" fill="#f2c96e"/></g><g class="effect food-effect" data-layer="effect-food"><path d="M232 227 Q212 203 230 200 Q241 193 244 204 Q263 198 261 216 Q252 235 232 227" fill="#efa28e" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 205 L245 193" fill="none" stroke="#63473f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect toy-effect" data-layer="effect-toy"><ellipse cx="254" cy="316" rx="19" ry="19" fill="#ad98df" stroke="#63473f" stroke-width="3" /><path d="M240 305 Q266 309 257 334 M245 303 Q243 321 268 322" fill="none" stroke="#e9e1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
