<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="团团猫 · 幼年"><title>团团猫 · 幼年</title><style>
.rig,.body,.head,.tail,.ear,.paw,.mouth-chew,.eyes {transform-box:fill-box}
.rig {transform-origin:50% 100%;animation:pet-breathe 3.6s ease-in-out infinite}
.tail {transform-origin:10% 85%;animation:pet-tail 7s ease-in-out infinite}
.ear.left {transform-origin:80% 20%}.ear.right {transform-origin:20% 20%}
.eyes {transform-origin:50% 50%;animation:pet-blink 6.8s linear infinite}
.eyes-happy,.mouth-chew,.effect {opacity:0}.head {transform-origin:50% 85%}
.paw.left {transform-origin:70% 10%}.paw.right {transform-origin:30% 10%}
svg[data-action="pet"] .head {animation:pet-nuzzle 1.2s ease-in-out 1}
svg[data-action="pet"] .eyes,svg[data-action="pet"] .mouth-normal {opacity:0;animation:none}
svg[data-action="pet"] .eyes-happy,svg[data-action="pet"] .hearts {opacity:1}
svg[data-action="feed"] .head {animation:pet-nod 1.9s ease-in-out 1}
svg[data-action="feed"] .mouth-normal {opacity:0}
svg[data-action="feed"] .mouth-chew {opacity:1;animation:pet-chew .35s ease-in-out 5}
svg[data-action="feed"] .food-effect {opacity:1;animation:pet-food 2s ease-out 1 forwards}
svg[data-action="play"] .rig {animation:pet-hop .7s ease-in-out 3}
svg[data-action="play"] .paw.left {animation:pet-wave .6s ease-in-out 3}
svg[data-action="play"] .toy-effect {opacity:1;animation:pet-ball 1.9s ease-in-out 1}
svg[data-action="correct"] .rig {animation:pet-hop .65s ease-in-out 2}
svg[data-action="correct"] .sparkles {opacity:1;animation:pet-sparkle 1.4s ease-out 1}
svg[data-action="encourage"] .head {animation:pet-nuzzle 1.2s ease-in-out 1}
svg[data-action="encourage"] .ear {animation:pet-ear .8s ease-in-out 2}
svg[data-action="upgrade"] .rig {animation:pet-celebrate 2s ease-in-out 1}
svg[data-action="upgrade"] .sparkles,svg[data-action="evolve"] .sparkles {opacity:1;animation:pet-sparkle 2.8s ease-in-out 1}
svg[data-action="evolve"] .rig {animation:pet-evolve 2.8s ease-in-out 1}
@keyframes pet-breathe {0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.018)}}
@keyframes pet-tail {0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-7deg)}84%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}
@keyframes pet-blink {0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.06)}}
@keyframes pet-nuzzle {0%,100%{transform:rotate(0)}35%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}}
@keyframes pet-nod {0%,100%{transform:rotate(0) translateY(0)}25%,65%{transform:rotate(3deg) translateY(4px)}45%,85%{transform:rotate(-2deg) translateY(1px)}}
@keyframes pet-chew {50%{transform:scale(1.2,.7)}}
@keyframes pet-hop {0%,100%{transform:translateY(0)}45%{transform:translateY(-12px) rotate(-2deg)}}
@keyframes pet-wave {0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes pet-ear {50%{transform:rotate(5deg)}}
@keyframes pet-celebrate {0%,100%{transform:translateY(0) scale(1)}25%,65%{transform:translateY(-14px) scale(1.035)}45%{transform:translateY(0)}}
@keyframes pet-evolve {0%,100%{opacity:1;transform:scale(1)}40%{opacity:.25;transform:scale(.95)}55%{opacity:.1;transform:scale(1.08)}80%{opacity:1;transform:scale(1.025)}}
@keyframes pet-sparkle {0%{opacity:0}25%,65%{opacity:1}100%{opacity:0}}
@keyframes pet-food {0%{opacity:0}25%,60%{opacity:1}100%{opacity:0}}
@keyframes pet-ball {0%,100%{transform:translateX(0)}35%{transform:translateX(-25px) rotate(-20deg)}70%{transform:translateX(15px) rotate(20deg)}}
svg[data-motion="reduced"] * {animation:none!important}
svg[data-motion="reduced"] .rig {transform:none!important}
@media(prefers-reduced-motion:reduce){.rig,.tail,.ear,.paw,.head,.eyes,.effect,.mouth-chew {animation:none!important}}
</style><g class="shadow" data-layer="shadow"><ellipse cx="161" cy="337" rx="65" ry="9" fill="#bbabc7" opacity=".23"/></g><g class="rig" data-layer="rig"><g class="tail" data-layer="tail"><path d="M197 298 Q284 223 279 276 Q278 328 199 316" fill="#ffe7c5" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M260 251 Q267 266 273 269" fill="none" stroke="#edc992" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></g><g data-layer="slot-back"></g><g class="body" data-layer="body"><ellipse cx="160" cy="280" rx="43" ry="44" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /><ellipse cx="160" cy="283" rx="27.52" ry="30.799999999999997" fill="#fff7e7" /></g><g data-layer="feet"><ellipse cx="136" cy="324" rx="21" ry="10" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /><ellipse cx="185" cy="324" rx="21" ry="10" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /></g><g data-layer="slot-body"></g><g class="head" data-layer="head"><g class="ear left" data-layer="ear-left"><path d="M136 171 Q118 132 101 108 Q87 120 96 193" fill="#ffe7c5" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M114 160 L102 125 L99 177" fill="#f3b8b4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="ear right" data-layer="ear-right"><path d="M184 171 Q202 132 219 108 Q233 120 224 193" fill="#ffe7c5" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M206 160 L218 125 L221 177" fill="#f3b8b4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g data-layer="face-base"><ellipse cx="160" cy="205" rx="65" ry="58" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /><path d="M145 152 L147 166" fill="none" stroke="#edc992" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M160 152 L162 166" fill="none" stroke="#edc992" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M175 152 L177 166" fill="none" stroke="#edc992" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 219 L87 215 M105 230 L88 233 M215 219 L234 215 M215 230 L232 233" fill="none" stroke="#63473f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="117" cy="225" rx="10" ry="6" fill="#f4b4a7" /><ellipse cx="204" cy="225" rx="10" ry="6" fill="#f4b4a7" /></g><g class="eyes" data-layer="eyes-open"><ellipse cx="136" cy="205" rx="6" ry="8" fill="#43323d" /><ellipse cx="184" cy="205" rx="6" ry="8" fill="#43323d" /><ellipse cx="134" cy="202" rx="1.8" ry="2" fill="#fff" /><ellipse cx="182" cy="202" rx="1.8" ry="2" fill="#fff" /></g><g class="eyes-happy" data-layer="eyes-happy"><path d="M129 206 Q136 196 143 206 M177 206 Q184 196 191 206" fill="none" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="mouth-normal" data-layer="mouth-normal"><path d="M154 219 Q160 225 166 219" fill="#f3b8b4" stroke="#63473f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M160 223 L160 229 M160 229 Q151 240 146 230 M160 229 Q169 240 175 230" fill="none" stroke="#63473f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="mouth-chew" data-layer="mouth-chew"><ellipse cx="160" cy="232" rx="6" ry="7" fill="#805b5a" /></g><g data-layer="slot-head"></g></g><g class="paw left" data-layer="paw-left"><ellipse cx="130" cy="288" rx="13" ry="22" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /><path d="M126 301 L126 306 M133 301 L133 306" fill="none" stroke="#63473f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="paw right" data-layer="paw-right"><ellipse cx="190" cy="288" rx="13" ry="22" fill="#ffe7c5" stroke="#63473f" stroke-width="3" /><path d="M186 301 L186 306 M193 301 L193 306" fill="none" stroke="#63473f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-layer="slot-accessory"></g></g><g class="effect hearts" data-layer="effect-hearts"><path d="M65 149 C50 137 48 158 65 170 C82 158 80 137 65 149" fill="#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M253 134 C238 122 236 143 253 155 C270 143 268 122 253 134" fill="#eea7b9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect sparkles" data-layer="effect-sparkles"><polygon points="66.00,150.00 69.51,158.16 78.36,158.98 71.69,164.85 73.64,173.52 66.00,168.98 58.36,173.52 60.31,164.85 53.64,158.98 62.49,158.16" fill="#f2c96e"/><polygon points="253.00,122.00 256.79,130.79 266.31,131.67 259.12,137.99 261.23,147.33 253.00,142.44 244.77,147.33 246.88,137.99 239.69,131.67 249.21,130.79" fill="#f2c96e"/><polygon points="62.00,279.00 64.16,284.02 69.61,284.53 65.50,288.14 66.70,293.47 62.00,290.68 57.30,293.47 58.50,288.14 54.39,284.53 59.84,284.02" fill="#f2c96e"/><polygon points="257.00,298.00 259.70,304.28 266.51,304.91 261.37,309.42 262.88,316.09 257.00,312.60 251.12,316.09 252.63,309.42 247.49,304.91 254.30,304.28" fill="#f2c96e"/></g><g class="effect food-effect" data-layer="effect-food"><path d="M232 251 Q212 227 230 224 Q241 217 244 228 Q263 222 261 240 Q252 259 232 251" fill="#efa28e" stroke="#63473f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 229 L245 217" fill="none" stroke="#63473f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="effect toy-effect" data-layer="effect-toy"><ellipse cx="254" cy="316" rx="19" ry="19" fill="#ad98df" stroke="#63473f" stroke-width="3" /><path d="M240 305 Q266 309 257 334 M245 303 Q243 321 268 322" fill="none" stroke="#e9e1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
